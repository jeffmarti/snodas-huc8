# ==============================================================================
# .github/workflows/daily_update.yml
#
# Nightly job to append the latest SNODAS date to the history CSV.
#
# Runs at 10:30 UTC (2:30am/3:30am PST/PDT) -- SNODAS is typically
# published by 10:00 UTC for the previous day.
#
# CHANGES:
#   - Added plotly, shiny, leaflet, readr to R packages
#   - appFiles updated to include huc8_base.rds and wa_border.rds
#     and exclude pipeline scripts and archived CSVs
#   - Pinned terra to 1.8-54 to avoid GDAL AsClassicDataset build
#     failure in terra 1.9.x on shinyapps.io build image
# ==============================================================================
name: SNODAS Daily Update
on:
  schedule:
    - cron: '0 14 * * *'   # 6am/7am PST
  workflow_dispatch:          # allow manual trigger
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.2'
          use-public-rspm: true
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libgdal-dev libgeos-dev libproj-dev libsqlite3-dev libudunits2-dev
      - name: Pin terra to a working version
        run: |
          Rscript -e 'install.packages("remotes"); remotes::install_version("terra", version = "1.8-54", repos = "https://cloud.r-project.org")'
      - name: Install R packages
        uses: r-lib/actions/setup-r-dependencies@v2
        env:
          PKG_SYSREQS: "false"
          RSPM: "https://packagemanager.posit.co/cran/__linux__/noble/latest"
        with:
          packages: |
            sf
            exactextractr
            httr
            dplyr
            nhdplusTools
            tigris
            rsconnect
            cpp11
            progress
            DT
            plotly
            shiny
            leaflet
            readr
            fs
      - name: Run daily update
        run: Rscript scripts/daily_update.R
      - name: Commit results
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name  "github-actions[bot]"
          git add data/
          git diff --staged --quiet || git commit -m "daily update: $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push
      - name: Deploy to shinyapps.io
        env:
          SHINYAPPS_TOKEN:  ${{ secrets.SHINYAPPS_TOKEN }}
          SHINYAPPS_SECRET: ${{ secrets.SHINYAPPS_SECRET }}
        run: |
          Rscript -e "
            rsconnect::setAccountInfo(
              name   = 'waterwater',
              token  = Sys.getenv('SHINYAPPS_TOKEN'),
              secret = Sys.getenv('SHINYAPPS_SECRET')
            )
            rsconnect::deployApp(
              appDir         = '.',
              appName        = 'snodas-huc8',
              appFiles       = c(
                'app.r',
                'cache/huc8_centroids.csv',
                'cache/huc8_base.rds',
                'cache/wa_border.rds',
                'data/snodas_huc8_history.csv',
                'R/mod_climate_compare.R',
                'data/ncei_climate_monthly_wa.csv'
              ),
              account        = 'waterwater',
              forceUpdate    = TRUE,
              launch.browser = FALSE,
              envManagement  = FALSE
            )
          "
